name: Build Atmosphere PR 2842

on:
  push:
    branches:
      - build/atmosphere-pr2842
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config: [nx_release, nx_debug, nx_audit]
    name: build-${{ matrix.config }}
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git zip python3 python3-pip python3-lz4
          dkp-pacman -S --needed --noconfirm switch-dev switch-glm switch-libjpeg-turbo devkitARM devkitarm-rules hactool switch-tools

      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          repository: Flexii2000/Atmosphere
          ref: cda3d46aa796cd949440afdb405663f65a737172
          path: Atmosphere
          fetch-depth: 0

      - name: Verify exact source
        working-directory: Atmosphere
        run: |
          test "$(git rev-parse HEAD)" = "cda3d46aa796cd949440afdb405663f65a737172"
          git rev-parse HEAD | tee ../SOURCE_SHA.txt
          git log -1 --oneline | tee ../SOURCE_COMMIT.txt

      - name: Build configuration serially
        working-directory: Atmosphere
        run: |
          # Deliberately do not pass -j here. Haze's ROMFS shader prerequisites can
          # race its nested NRO build under parallel make, producing a false
          # 'No rule to make target ... console_fsh.dksh' failure.
          make ${{ matrix.config }}

      - name: Create release distribution
        if: matrix.config == 'nx_release'
        working-directory: Atmosphere
        run: make dist-no-debug-nx_release

      - name: Collect products
        run: |
          set -eu
          mkdir -p artifacts/${{ matrix.config }}/products
          cp SOURCE_SHA.txt SOURCE_COMMIT.txt artifacts/${{ matrix.config }}/
          if [ -d Atmosphere/out ]; then
            cp -a Atmosphere/out/. artifacts/${{ matrix.config }}/products/
          fi
          find Atmosphere -type f \( -name '*.bin' -o -name '*.kip' -o -name '*.nsp' -o -name '*.nro' -o -name '*.elf' -o -name '*.zip' \) -print0 \
            | tar --null -T - -czf artifacts/${{ matrix.config }}/all-build-products.tar.gz
          printf 'PR: Atmosphere-NX/Atmosphere#2842\nHead: Flexii2000/Atmosphere 23_support_pt2\nCommit: cda3d46aa796cd949440afdb405663f65a737172\nConfiguration: ${{ matrix.config }}\nClassification: locally compiled GitHub Actions output from the PR prototype; not independently boot-tested.\n' > artifacts/${{ matrix.config }}/BUILD_INFO.txt
          cd artifacts/${{ matrix.config }}
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload configuration
        uses: actions/upload-artifact@v4
        with:
          name: Atmosphere_PR2842_${{ matrix.config }}
          path: artifacts/${{ matrix.config }}/
          if-no-files-found: error
          retention-days: 7
