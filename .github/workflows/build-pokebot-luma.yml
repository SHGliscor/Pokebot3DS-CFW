name: Build Pokebot-Luma

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'luma_pokebot_bridge/**'
      - '.github/workflows/build-pokebot-luma.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Pokebot repo
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-pip ca-certificates wget unzip make
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git@fdc7085c2394d87ce5dbdfecdf51423e1e7b00a1
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O /tmp/makerom.zip
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          install -m755 /tmp/makerom/makerom /usr/local/bin/makerom
          command -v firmtool
          command -v makerom

      - name: Fetch pinned Luma3DS source
        run: |
          set -eux
          git clone https://github.com/LumaTeam/Luma3DS.git Luma3DS
          cd Luma3DS
          git checkout d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a
          test "$(git rev-parse HEAD)" = "d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a"

      - name: Apply Pokebot RAM, controller and framebuffer patches
        run: |
          set -eux
          python3 luma_pokebot_bridge/tools/apply_ram_bridge.py
          python3 luma_pokebot_bridge/tools/apply_ram_bridge_compile_fix.py
          python3 luma_pokebot_bridge/tools/apply_pokebot_menu.py
          python3 luma_pokebot_bridge/tools/apply_additive_input_redirection.py
          python3 luma_pokebot_bridge/tools/apply_ack_controller_v0p5.py
          python3 luma_pokebot_bridge/tools/apply_framebuffer_bridge.py
          python3 -m py_compile \
            luma_pokebot_bridge/tools/apply_framebuffer_bridge.py \
            luma_pokebot_bridge/tools/test_pokebot_luma_framebuffer.py

          grep -q 'Pokebot-Luma v0p5-fb2' Luma3DS/sysmodules/rosalina/source/menus.c
          grep -q 'PokebotInputController_SetEnabled' Luma3DS/sysmodules/rosalina/source/menus.c
          grep -q 'POKEBOT_RAM_PORT       4952' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_MAX_READ       0x200' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_MAX_PAYLOAD    0x500' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q '#include "sock_util.h"' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q '#include "draw.h"' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_READ      = 4' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'req->command >= 5 && req->command <= 10' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_FRAMEBUFFER_INFO = 11' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_FRAMEBUFFER_READ = 12' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_FRAMEBUFFER_SNAPSHOT = 13' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_FRAMEBUFFER_SNAPSHOT_READ = 14' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_FB_FLAG_FROZEN' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'Draw_PokebotConvertFrameBufferSpan' Luma3DS/sysmodules/rosalina/source/draw.c
          grep -q 'Draw_PokebotConvertFrameBufferSpan' Luma3DS/sysmodules/rosalina/include/draw.h
          grep -q 'POKEBOT_CMD_INPUT_PULSE  6' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c
          grep -q 'POKEBOT_CMD_INPUT_STATUS 7' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c
          grep -q 'POKEBOT_CMD_RELEASE_ALL  8' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c
          grep -q 'POKEBOT_CMD_TOUCH_PULSE  9' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c
          grep -q 'POKEBOT_CMD_HID_LATCH   10' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c
          grep -q 'POKEBOT_INPUT_CAPS     0x000000CFUL' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c
          grep -q 'PokebotInput_SetRemoteHid' Luma3DS/sysmodules/rosalina/source/input_redirection.c
          grep -q 'PokebotInput_SetRemoteTouch' Luma3DS/sysmodules/rosalina/source/input_redirection.c
          grep -q 'Pokebot additive HID' Luma3DS/sysmodules/rosalina/source/input_redirection_hooks.s
          grep -q 'and r1, r1, r2      @ Active-low union' Luma3DS/sysmodules/rosalina/source/input_redirection_hooks.s
          ! grep -q 'WriteTarget' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          ! grep -q 'svcWriteProcessMemory' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          ! grep -q 'svcWriteProcessMemory' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c

      - name: Build boot.firm
        run: |
          set -eux
          make -C Luma3DS -j"$(nproc)"
          test -s Luma3DS/boot.firm
          test -s Luma3DS/sysmodules/rosalina/rosalina.elf
          sha256sum Luma3DS/boot.firm

      - name: Stage hardware-test package
        run: |
          set -eux
          mkdir -p artifact/SD_ROOT artifact/SOURCE_PATCHES artifact/DEBUG_SYMBOLS artifact/PC_TEST
          cp Luma3DS/boot.firm artifact/SD_ROOT/boot.firm
          cp luma_pokebot_bridge/tools/apply_pokebot_menu.py artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/tools/apply_additive_input_redirection.py artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/tools/apply_ram_bridge.py artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/tools/apply_ram_bridge_compile_fix.py artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/tools/apply_ack_controller_v0p5.py artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/tools/apply_framebuffer_bridge.py artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/tools/test_pokebot_luma_ram.py artifact/PC_TEST/
          cp luma_pokebot_bridge/tools/test_pokebot_luma_controller.py artifact/PC_TEST/
          cp luma_pokebot_bridge/tools/test_pokebot_luma_framebuffer.py artifact/PC_TEST/
          cp luma_pokebot_bridge/README.md artifact/
          cp luma_pokebot_bridge/FRAMEBUFFER.md artifact/
          cp Luma3DS/LICENSE artifact/LUMA3DS_LICENSE.txt
          cp Luma3DS/sysmodules/rosalina/rosalina.elf artifact/DEBUG_SYMBOLS/
          cp Luma3DS/sysmodules/rosalina/build/rosalina.map artifact/DEBUG_SYMBOLS/ || true
          cp Luma3DS/sysmodules/rosalina/build/rosalina.lst artifact/DEBUG_SYMBOLS/ || true
          cat > artifact/FIRST_TEST.txt <<'EOF'
          Pokebot-Luma v0p5-fb2 frozen framebuffer hardware proof

          Commands 1-12 remain unchanged. New read-only framebuffer commands:
            13 FRAMEBUFFER_SNAPSHOT
            14 FRAMEBUFFER_SNAPSHOT_READ

          The snapshot command converts the complete 240-line screen during one
          firmware request from one selected framebuffer address. The PC then
          downloads the frozen BGR8 copy, eliminating UDP row-to-row tearing.

          1. Back up your current known-good boot.firm.
          2. Replace SD-root boot.firm with SD_ROOT/boot.firm.
          3. Boot normally and launch ORAS.
          4. Do NOT enable standard Rosalina Miscellaneous -> InputRedirection.
          5. Open Rosalina -> Pokebot3DS Bridge... -> Enable Both.
          6. Status should show Pokebot-Luma v0p5-fb2.
          7. Confirm physical controls/touch still work.
          8. Re-run controller and RAM smoke tests.
          9. Use the v0p42ZI bot for a shiny framebuffer proof.

          PASS GATE:
          - commands 1-10/controller behavior unchanged
          - RAM PING/GAME_INFO/QUERY/READ passes
          - shiny capture reports frozen=true / commands 13-14
          - raw shiny PNG has no horizontal mixed-frame tearing

          SAFETY:
          - no game RAM write command
          - RAM READ max remains 0x200
          - commands 11-12 retained unchanged
          - frozen snapshot is presentation/evidence only
          - static snapshot buffer is bounded to 400x240x3 bytes
          EOF
          printf '%s\n' 'Upstream Luma3DS commit: d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a' > artifact/SOURCE_PATCHES/UPSTREAM.txt
          sha256sum artifact/SD_ROOT/boot.firm > artifact/BOOT_FIRM_SHA256.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-Luma-v0p5-fb2-FrozenFramebuffer
          path: artifact/
          if-no-files-found: error
