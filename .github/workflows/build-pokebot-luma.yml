name: Build Pokebot-Luma

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v0p7-runtime-diagnostics
    paths:
      - 'luma_pokebot_bridge/**'
      - '.github/workflows/build-pokebot-luma.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'luma_pokebot_bridge/**'
      - '.github/workflows/build-pokebot-luma.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Pokebot repo
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-pip ca-certificates wget unzip make
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git@fdc7085c2394d87ce5dbdfecdf51423e1e7b00a1
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O /tmp/makerom.zip
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          install -m755 /tmp/makerom/makerom /usr/local/bin/makerom

      - name: Fetch pinned Luma3DS source
        run: |
          set -eux
          git clone https://github.com/LumaTeam/Luma3DS.git Luma3DS
          cd Luma3DS
          git checkout d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a
          test "$(git rev-parse HEAD)" = "d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a"

      - name: Apply controller framebuffer latency and diagnostic patches
        run: |
          set -eux
          python3 luma_pokebot_bridge/tools/apply_ram_bridge.py
          python3 luma_pokebot_bridge/tools/apply_ram_bridge_compile_fix.py
          python3 luma_pokebot_bridge/tools/apply_pokebot_menu.py
          python3 luma_pokebot_bridge/tools/apply_additive_input_redirection.py
          python3 luma_pokebot_bridge/tools/apply_ack_controller_v0p5.py
          python3 luma_pokebot_bridge/tools/apply_framebuffer_bridge.py
          python3 luma_pokebot_bridge/tools/apply_n3ds_latency_fix_fb.py
          python3 luma_pokebot_bridge/tools/apply_runtime_diagnostics_v0p7.py

          grep -q 'Pokebot-Luma v0p7 runtime diagnostics' Luma3DS/sysmodules/rosalina/source/menus.c
          grep -q 'Pokebot3DS-Luma-v0p7-runtime-diag' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'socPoll(&pfd, 1, 0)' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'svcSleepThread(POKEBOT_IDLE_YIELD_US \* 1000LL)' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q '#define POKEBOT_BRIDGE_PRIORITY 0x20' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_BRIDGE_PRIORITY, CORE_SYSTEM' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'diagnostics.bridgePriority = POKEBOT_BRIDGE_PRIORITY' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'diagnostics.consoleModel = isN3DS ? 2 : 1' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_DIAGNOSTICS = 15' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_FRAMEBUFFER_INFO = 11' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_FRAMEBUFFER_READ = 12' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_INPUT_CAPS     0x000000CFUL' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c
          grep -q 'POKEBOT_MAX_READ       0x200' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          ! grep -q 'svcWriteProcessMemory' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          ! grep -q 'svcWriteProcessMemory' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c

      - name: Build boot.firm
        run: |
          set -eux
          make -C Luma3DS -j"$(nproc)"
          test -s Luma3DS/boot.firm
          test -s Luma3DS/sysmodules/rosalina/rosalina.elf
          strings Luma3DS/sysmodules/rosalina/rosalina.elf | grep -q 'Pokebot3DS-Luma-v0p7-runtime-diag'
          sha256sum Luma3DS/boot.firm

      - name: Stage runtime diagnostics package
        run: |
          set -eux
          mkdir -p artifact/SD_ROOT artifact/PC_TEST artifact/SOURCE_PATCHES
          cp Luma3DS/boot.firm artifact/SD_ROOT/boot.firm
          cp luma_pokebot_bridge/tools/test_pokebot_luma_ram.py artifact/PC_TEST/
          cp luma_pokebot_bridge/tools/test_pokebot_luma_controller.py artifact/PC_TEST/
          cp luma_pokebot_bridge/tools/test_pokebot_luma_framebuffer.py artifact/PC_TEST/
          cp luma_pokebot_bridge/tools/test_pokebot_luma_diagnostics.py artifact/PC_TEST/
          cp luma_pokebot_bridge/tools/apply_n3ds_latency_fix_fb.py artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/tools/apply_runtime_diagnostics_v0p7.py artifact/SOURCE_PATCHES/
          sha256sum artifact/SD_ROOT/boot.firm > artifact/BOOT_FIRM_SHA256.txt
          cat > artifact/FIRST_TEST.txt <<'EOF'
          Pokebot-Luma v0p7-runtime-diag
          Command 15 reports the detected 3DS model, compiled bridge priority,
          idle yield, exact build ID, and controller-side HID write counters.
          New 3DS latency fix + framebuffer commands 11-12 are preserved.
          Commands 1-10 and RAM read-only authority are preserved.
          Standard Rosalina InputRedirection must remain OFF.
          Rosalina -> Pokebot3DS Bridge -> Enable Both.
          EOF

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-Luma-v0p7-runtime-diagnostics
          path: artifact/
          if-no-files-found: error
