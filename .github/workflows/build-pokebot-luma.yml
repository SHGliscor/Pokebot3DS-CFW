name: Build Pokebot TWL Direct PoC

on:
  workflow_dispatch:
  push:
    branches:
      - pokebot-twl-direct-poc-v0p1
  pull_request:
    branches:
      - main
    paths:
      - 'luma_pokebot_bridge/**'
      - '.github/workflows/build-pokebot-luma.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Pokebot repo
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-pip ca-certificates wget unzip make
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git@fdc7085c2394d87ce5dbdfecdf51423e1e7b00a1
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O /tmp/makerom.zip
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          install -m755 /tmp/makerom/makerom /usr/local/bin/makerom
          command -v firmtool
          command -v makerom
          command -v arm-none-eabi-as
          command -v arm-none-eabi-objcopy

      - name: Fetch pinned Luma3DS source
        run: |
          set -eux
          git clone https://github.com/LumaTeam/Luma3DS.git Luma3DS
          cd Luma3DS
          git checkout d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a
          test "$(git rev-parse HEAD)" = "d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a"

      - name: Apply proven Pokebot-Luma bridge patches
        run: |
          set -eux
          python3 luma_pokebot_bridge/tools/apply_ram_bridge.py
          python3 luma_pokebot_bridge/tools/apply_ram_bridge_compile_fix.py
          python3 luma_pokebot_bridge/tools/apply_pokebot_menu.py
          python3 luma_pokebot_bridge/tools/apply_additive_input_redirection.py
          python3 luma_pokebot_bridge/tools/apply_ack_controller_v0p5.py
          grep -q 'Pokebot-Luma v0p5' Luma3DS/sysmodules/rosalina/source/menus.c
          grep -q 'POKEBOT_RAM_PORT       4952' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c
          grep -q 'POKEBOT_CMD_INPUT_PULSE  6' Luma3DS/sysmodules/rosalina/source/pokebot_input_controller.c
          ! grep -q 'svcWriteProcessMemory' Luma3DS/sysmodules/rosalina/source/pokebot_ram_bridge.c

      - name: Build direct TwlBg ARM11 hook
        run: |
          set -eux
          arm-none-eabi-as -mcpu=mpcore -mthumb luma_pokebot_bridge/twl_direct_poc/pokebot_twl_hook.s -o /tmp/pokebot_twl_hook.o
          arm-none-eabi-objcopy -O binary /tmp/pokebot_twl_hook.o /tmp/pokebot_twl_hook.bin
          test -s /tmp/pokebot_twl_hook.bin
          wc -c /tmp/pokebot_twl_hook.bin
          sha256sum /tmp/pokebot_twl_hook.bin

      - name: Patch stock TwlBg at TWL_FIRM launch
        run: |
          set -eux
          python3 luma_pokebot_bridge/tools/apply_twl_direct_poc.py --hook-bin /tmp/pokebot_twl_hook.bin
          grep -q 'findPokebotTwlCodeCave' Luma3DS/arm9/source/patches.c
          grep -q 'hidUpdatePattern' Luma3DS/arm9/source/patches.c
          grep -q 'pokebot_twl_hook_bin' Luma3DS/arm9/source/patches.c
          grep -q 'patchTwlBg(copyRes.codeDstAddr, copyRes.codeSize, copyRes.textSize)' Luma3DS/arm9/source/firm.c
          grep -q 'u32 textSize;' Luma3DS/arm9/source/firm.c

      - name: Build boot.firm
        run: |
          set -eux
          make -C Luma3DS -j"$(nproc)"
          test -s Luma3DS/boot.firm
          sha256sum Luma3DS/boot.firm

      - name: Stage direct-TWL hardware proof
        run: |
          set -eux
          mkdir -p artifact/SD_ROOT artifact/SOURCE_PATCHES
          cp Luma3DS/boot.firm artifact/SD_ROOT/boot.firm
          cp luma_pokebot_bridge/twl_direct_poc/pokebot_twl_hook.s artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/tools/apply_twl_direct_poc.py artifact/SOURCE_PATCHES/
          cp Luma3DS/LICENSE artifact/LUMA3DS_LICENSE.txt
          cp /tmp/pokebot_twl_hook.bin artifact/SOURCE_PATCHES/pokebot_twl_hook.bin
          cat > artifact/FIRST_TEST.txt <<'EOF'
          Pokebot TWL Direct PoC v0p1

          PURPOSE
          Prove direct ARM11 TwlBg -> DS input injection on real hardware.
          This does not use RTCom, an ARM7 patch, a patched DS ROM, or the
          nds-bootstrap Pokebot mailbox.

          TEST MAPPING
          Physical New 3DS Y button -> DS A.
          Physical Y is suppressed while the override is active.

          INSTALL
          1. Back up the boot.firm that currently works on this console.
          2. Replace only SD:/boot.firm with SD_ROOT/boot.firm from this package.
          3. Do not install a TwlBg.cxi.
          4. Boot the 3DS normally.
          5. Launch HeartGold through the same normal method already used.

          HARDWARE TEST
          1. Confirm HeartGold reaches the overworld.
          2. Confirm normal physical A still works.
          3. Face an NPC, sign, PC, or harmless object where A has an obvious effect.
          4. Press physical Y once.

          PASS
          Y performs the same DS action as one A press.

          FAILURE
          If TWL_FIRM/HeartGold does not boot, restore the backed-up boot.firm.
          If HeartGold boots but Y remains normal Y or does nothing, report that.
          Avoid HOME during this finite PoC because this proof shares the LGY
          HID-emulation registers used by TwlBg.

          SAFETY
          - no Pokemon/game RAM writes
          - no DS ROM modification
          - normal Pokebot-Luma RAM bridge remains read-only
          - dedicated experimental branch/build only
          EOF
          echo 'Upstream Luma3DS: d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a' > artifact/SOURCE_PATCHES/BUILD_INFO.txt
          echo 'PoC branch: pokebot-twl-direct-poc-v0p1' >> artifact/SOURCE_PATCHES/BUILD_INFO.txt
          sha256sum artifact/SD_ROOT/boot.firm > artifact/BOOT_FIRM_SHA256.txt
          sha256sum artifact/SOURCE_PATCHES/pokebot_twl_hook.bin > artifact/TWL_HOOK_SHA256.txt

      - name: Upload direct-TWL test package
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-TWL-Direct-v0p1
          path: artifact/
          if-no-files-found: error
