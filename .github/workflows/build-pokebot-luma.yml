name: Build Pokebot-Luma

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'luma_pokebot_bridge/**'
      - '.github/workflows/build-pokebot-luma.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Pokebot repo
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-pip ca-certificates wget unzip make
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git@fdc7085c2394d87ce5dbdfecdf51423e1e7b00a1
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O /tmp/makerom.zip
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          install -m755 /tmp/makerom/makerom /usr/local/bin/makerom
          command -v firmtool
          command -v makerom

      - name: Fetch pinned Luma3DS source
        run: |
          set -eux
          git clone https://github.com/LumaTeam/Luma3DS.git Luma3DS
          cd Luma3DS
          git checkout d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a
          test "$(git rev-parse HEAD)" = "d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a"

      - name: Apply Pokebot Rosalina patch
        run: |
          set -eux
          python3 luma_pokebot_bridge/tools/apply_pokebot_menu.py
          grep -q 'Pokebot-Luma v0p1' Luma3DS/sysmodules/rosalina/source/menus.c
          grep -q 'Pokebot3DS Bridge...' Luma3DS/sysmodules/rosalina/source/menus.c

      - name: Build boot.firm
        run: |
          set -eux
          make -C Luma3DS -j"$(nproc)"
          test -s Luma3DS/boot.firm
          sha256sum Luma3DS/boot.firm

      - name: Stage hardware-test package
        run: |
          set -eux
          mkdir -p artifact/SD_ROOT artifact/SOURCE_PATCHES
          cp Luma3DS/boot.firm artifact/SD_ROOT/boot.firm
          cp luma_pokebot_bridge/tools/apply_pokebot_menu.py artifact/SOURCE_PATCHES/
          cp luma_pokebot_bridge/README.md artifact/
          cp Luma3DS/LICENSE artifact/LUMA3DS_LICENSE.txt
          cat > artifact/FIRST_TEST.txt <<'EOF'
          Pokebot-Luma v0p1 hardware test

          v0p1 is a foundation build only. It adds the Pokebot3DS Bridge submenu
          to Rosalina. It does not yet provide RAM networking or controller input.

          IMPORTANT:
          1. Keep a copy of your current working boot.firm.
          2. Replace the SD-card root boot.firm with SD_ROOT/boot.firm.
          3. Boot the 3DS normally.
          4. Confirm HOME Menu controls and touch still work.
          5. Launch ORAS and confirm the game behaves normally.
          6. Open Rosalina with L + Down + Select.
          7. Open "Pokebot3DS Bridge...".
          8. Confirm RAM Bridge and Input Controller both begin OFF.
          9. Toggle them ON/OFF and open Status.
          10. Reboot the console and confirm both are OFF again.

          If the console does not boot, restore your known-good boot.firm using
          the SD card. Do not continue to RAM/controller backend work until this
          menu-only build is confirmed stable.
          EOF
          printf '%s\n' 'Upstream Luma3DS commit: d30ac8d1c665ed2a50dc30b291f7eb6b33e9890a' > artifact/SOURCE_PATCHES/UPSTREAM.txt
          sha256sum artifact/SD_ROOT/boot.firm > artifact/BOOT_FIRM_SHA256.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-Luma-v0p1-MenuFoundation
          path: artifact/
          if-no-files-found: error
