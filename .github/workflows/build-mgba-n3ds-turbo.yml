name: Build mGBA N3DS Bot Turbo

on:
  workflow_dispatch:
  push:
    branches:
      - mgba-n3ds-bot-turbo-v0p1
    paths:
      - 'mgba-n3ds-turbo/**'
      - '.github/workflows/build-mgba-n3ds-turbo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Pokebot3DS-CFW
        uses: actions/checkout@v4

      - name: Install host build tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends make g++ cmake git wget unzip

      - name: Build and install bannertool
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git bannertool-src
          cmake -S bannertool-src -B bannertool-src/build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build bannertool-src/build --parallel 2
          find bannertool-src/build -type f -name bannertool -print -exec install -m 0755 {} /usr/local/bin/bannertool \;
          command -v bannertool
          bannertool --help >/dev/null 2>&1 || true

      - name: Install makerom
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O /tmp/makerom.zip
          unzip -o /tmp/makerom.zip -d /tmp/makerom
          install -m 0755 /tmp/makerom/makerom /usr/local/bin/makerom
          command -v makerom
          makerom -help >/dev/null

      - name: Fetch pinned mGBA
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/mgba-emu/mgba.git mgba-src
          cd mgba-src
          git checkout 25ca25612eb806ad3a70f3209ccd93890ea0c2c6

      - name: Apply N3DS bot turbo patch
        shell: bash
        run: |
          set -euxo pipefail
          cd mgba-src
          git apply --check ../mgba-n3ds-turbo/patches/0001-n3ds-bot-turbo.patch
          git apply ../mgba-n3ds-turbo/patches/0001-n3ds-bot-turbo.patch
          git diff --check

      - name: Configure 3DS release build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S "$GITHUB_WORKSPACE/mgba-src" -B "$GITHUB_WORKSPACE/mgba-src/build" \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/mgba-src/src/platform/3ds/CMakeToolchain.txt" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBANNERTOOL=/usr/local/bin/bannertool \
            -DMAKEROM=/usr/local/bin/makerom

      - name: Build N3DS turbo 3DSX and CIA
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$GITHUB_WORKSPACE/mgba-src/build" --target mgba.3dsx mgba.cia --parallel 2
          test -f mgba-src/build/3ds/mgba.3dsx
          test -f mgba-src/build/3ds/mgba.cia
          test -f mgba-src/build/3ds/mgba.elf
          ls -lh mgba-src/build/3ds/mgba.3dsx mgba-src/build/3ds/mgba.cia mgba-src/build/3ds/mgba.elf

      - name: Stage artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp mgba-src/build/3ds/mgba.3dsx out/mgba-n3ds-bot-turbo-v0p1.3dsx
          cp mgba-src/build/3ds/mgba.cia out/mgba-n3ds-bot-turbo-v0p1.cia
          cp mgba-src/build/3ds/mgba.elf out/mgba-n3ds-bot-turbo-v0p1.elf
          cp mgba-n3ds-turbo/README.md out/TEST_INSTRUCTIONS.md
          printf '%s\n' '25ca25612eb806ad3a70f3209ccd93890ea0c2c6' > out/UPSTREAM_MGBA_COMMIT.txt
          (cd out && sha256sum mgba-n3ds-bot-turbo-v0p1.3dsx mgba-n3ds-bot-turbo-v0p1.cia mgba-n3ds-bot-turbo-v0p1.elf TEST_INSTRUCTIONS.md UPSTREAM_MGBA_COMMIT.txt > SHA256SUMS.txt)

      - name: Upload mGBA N3DS Bot Turbo
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot3DS-CFW-mGBA-N3DS-BotTurbo-v0p1
          path: out/
          if-no-files-found: error
          compression-level: 9
