name: Build Stock-Luma 3GX Bridge

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'stock_luma_plugin/**'
      - '.github/workflows/build-stock-luma-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ make git ca-certificates python3

      - name: Build and install 3gxtool 1.3
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://gitlab.com/thepixellizeross/3gxtool.git /tmp/3gxtool
          cmake -S /tmp/3gxtool -B /tmp/3gxtool/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3gxtool/build --config Release -j"$(nproc)"
          install -m755 "$(find /tmp/3gxtool/build -name '3gxtool' -type f -perm -u+x | head -n1)" \
            /opt/devkitpro/tools/bin/3gxtool
          3gxtool | head -n 3 || true

      - name: Build CTRPluginFramework library
        run: |
          set -eux
          git clone https://github.com/Tekito-256/CTRPluginFramework.git /tmp/ctrpf
          git -C /tmp/ctrpf checkout 1f2e34c9d4289873a6601cb5a4631d991a0fdf36
          sed -i 's/-Wall -Werror /-Wall /' /tmp/ctrpf/Library/Makefile
          python3 stock_luma_plugin/tools/patch_ctrpf_hid_map_locator.py
          grep -q 'gPokebotSharedMapCount' /tmp/ctrpf/Library/source/pluginInit.cpp
          grep -q 'gPokebotHidHeuristicAddr' /tmp/ctrpf/Library/source/pluginInit.cpp
          make -C /tmp/ctrpf/Library lib/libctrpf.a
          test -f /tmp/ctrpf/Library/lib/libctrpf.a
          test -f /tmp/ctrpf/Library/include/types.h
          "$DEVKITARM/bin/arm-none-eabi-nm" /tmp/ctrpf/Library/lib/libctrpf.a | grep -q ' svcControlMemoryUnsafe$'
          "$DEVKITARM/bin/arm-none-eabi-nm" /tmp/ctrpf/Library/lib/libctrpf.a | grep -q ' gPokebotSharedMapCount$'

      - name: Build Pokebot3DS plugin
        run: |
          set -eux
          "$DEVKITARM/bin/arm-none-eabi-g++" --version | head -1
          python3 stock_luma_plugin/tools/apply_status_overlay.py
          python3 stock_luma_plugin/tools/apply_soc_sharedmem_fix.py
          python3 stock_luma_plugin/tools/apply_hid_current_sample_fix.py
          python3 stock_luma_plugin/tools/apply_game_hid_memory_fix.py
          python3 stock_luma_plugin/tools/apply_hid_diagnostic_overlay.py
          python3 stock_luma_plugin/tools/apply_hid_map_locator.py
          python3 stock_luma_plugin/tools/apply_hid_region_locator.py
          sed -i 's/Pokebot Bridge v0p2/Pokebot Bridge v0p9/' stock_luma_plugin/Sources/BridgeOverlay.hpp
          grep -q 'Pokebot Bridge v0p9' stock_luma_plugin/Sources/BridgeOverlay.hpp
          grep -q 'BridgeOverlay::RecordPacket' stock_luma_plugin/Sources/Main.cpp
          grep -q 'srvInit()' stock_luma_plugin/Sources/Main.cpp
          grep -q 'kSocBufferAddress = 0x07500000u' stock_luma_plugin/Sources/Main.cpp
          grep -q 'kSocBufferSize = 0x20000' stock_luma_plugin/Sources/Main.cpp
          grep -q 'svcControlMemoryUnsafe' stock_luma_plugin/Sources/Main.cpp
          grep -q 'local.sin_addr.s_addr = gethostid()' stock_luma_plugin/Sources/Main.cpp
          grep -q 'settings.UseGameHidMemory = true' stock_luma_plugin/Sources/Main.cpp
          grep -q 'HID REGION Candidates:%lu' stock_luma_plugin/Sources/BridgeOverlay.hpp
          grep -q 'MEMSTATE_SHARED' stock_luma_plugin/Sources/BridgeOverlay.hpp
          grep -q 'MEMSTATE_ALIASED' stock_luma_plugin/Sources/BridgeOverlay.hpp
          grep -q 'MEMSTATE_ALIAS' stock_luma_plugin/Sources/BridgeOverlay.hpp
          ! grep -q 'Controller::InjectKey(keys)' stock_luma_plugin/Sources/Main.cpp
          ! grep -q 'SO_RCVTIMEO' stock_luma_plugin/Sources/Main.cpp
          grep -q 'Pokebot3DS-3GX-v0p9' stock_luma_plugin/Sources/Main.cpp
          make -C stock_luma_plugin \
            CTRPFLIB=/tmp/ctrpf/Library \
            CTRPFHEADERS=/tmp/ctrpf/Library/include
          test -f stock_luma_plugin/Pokebot3DSBridge.3gx
          head -c 8 stock_luma_plugin/Pokebot3DSBridge.3gx | grep -q '3GX\$0002'
          ls -lh stock_luma_plugin/Pokebot3DSBridge.3gx
          sha256sum stock_luma_plugin/Pokebot3DSBridge.3gx

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot3DSBridge-v0p9-HidRegionLocator
          path: stock_luma_plugin/Pokebot3DSBridge.3gx
          if-no-files-found: error
