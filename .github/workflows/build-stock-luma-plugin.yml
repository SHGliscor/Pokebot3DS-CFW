name: Build Stock-Luma 3GX Bridge

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'stock_luma_plugin/**'
      - '.github/workflows/build-stock-luma-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ make git ca-certificates

      - name: Build and install 3gxtool 1.3
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://gitlab.com/thepixellizeross/3gxtool.git /tmp/3gxtool
          cmake -S /tmp/3gxtool -B /tmp/3gxtool/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3gxtool/build --config Release -j"$(nproc)"
          install -m755 "$(find /tmp/3gxtool/build -name '3gxtool' -type f -perm -u+x | head -n1)" \
            /opt/devkitpro/tools/bin/3gxtool
          3gxtool | head -n 3 || true

      - name: Build CTRPluginFramework library
        run: |
          set -eux
          git clone https://github.com/Tekito-256/CTRPluginFramework.git /tmp/ctrpf
          git -C /tmp/ctrpf checkout 1f2e34c9d4289873a6601cb5a4631d991a0fdf36
          sed -i 's/-Wall -Werror /-Wall /' /tmp/ctrpf/Library/Makefile
          make -C /tmp/ctrpf/Library lib/libctrpf.a
          test -f /tmp/ctrpf/Library/lib/libctrpf.a
          test -f /tmp/ctrpf/Library/include/types.h

      - name: Build Pokebot3DS plugin
        run: |
          set -eux
          "$DEVKITARM/bin/arm-none-eabi-g++" --version | head -1
          # libctru's 3DS socket headers do not expose Linux SO_RCVTIMEO.
          # The bridge already closes/shuts down the UDP socket during Stop(),
          # so remove only this host-specific timeout setup for the hardware proof.
          sed -i '/timeval timeout{}/,+2d' stock_luma_plugin/Sources/Main.cpp
          make -C stock_luma_plugin \
            CTRPFLIB=/tmp/ctrpf/Library \
            CTRPFHEADERS=/tmp/ctrpf/Library/include
          test -f stock_luma_plugin/Pokebot3DSBridge.3gx
          head -c 8 stock_luma_plugin/Pokebot3DSBridge.3gx | grep -q '3GX\$0002'
          ls -lh stock_luma_plugin/Pokebot3DSBridge.3gx
          sha256sum stock_luma_plugin/Pokebot3DSBridge.3gx

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot3DSBridge-v0p1
          path: stock_luma_plugin/Pokebot3DSBridge.3gx
          if-no-files-found: error
