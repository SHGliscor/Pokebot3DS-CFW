name: Sync v0p42L integrated source

on:
  push:
    branches:
      - sync-v0p42l-source
    paths:
      - source_payload/v0p42L/READY

permissions:
  contents: write

jobs:
  unpack-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: sync-v0p42l-source
          fetch-depth: 0

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source_payload/v0p42L/parts/part-*.b64 > /tmp/pokebot-v0p42L.tar.xz.b64
          base64 --decode /tmp/pokebot-v0p42L.tar.xz.b64 > /tmp/pokebot-v0p42L.tar.xz
          echo '287a9181501e6cd3bfd1be6e29cbf910af91572d0cdca0d70cf6e33d54b02fb4  /tmp/pokebot-v0p42L.tar.xz' | sha256sum -c -

      - name: Extract integrated source over repository
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/pokebot-v0p42L.tar.xz -C .
          rm -rf source_payload/v0p42L
          rm -f .github/workflows/sync-v0p42l-source.yml

      - name: Verify Luma transport and no Nexus references
        shell: bash
        run: |
          set -euo pipefail
          test -f pokebot/common/luma_input.py
          test -f 3ds_sd/Pokebot-Luma-source/apply_pokebot_menu.py
          test -f 3ds_sd/Pokebot-Luma-source/apply_ram_bridge.py
          grep -q '"ram_bridge_port": 4952' qt_ui/settings_store.py
          grep -q '"input_port": 4950' qt_ui/settings_store.py
          ! grep -RniI -E 'nexus3ds|nexus' . --exclude-dir=.git
          python - <<'PY'
          from pathlib import Path
          import ast
          files = list(Path('.').rglob('*.py'))
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'Python AST check PASS: {len(files)} files')
          PY

      - name: Commit integrated v0p42L source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add v0p42L Pokebot-Luma integrated bot source'
          git push origin HEAD:sync-v0p42l-source
