name: Build usb-botbase HOS23 Test

on:
  push:
    branches: ["build/usb-botbase-hos23"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y git zip

      - name: Clone current Koi usb-botbase
        run: |
          git clone --depth 1 https://github.com/Koi-3088/usb-botbase.git /tmp/usb-botbase
          cd /tmp/usb-botbase
          echo "USB_BOTBASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD

      - name: Build against current devkitA64/libnx
        run: |
          cd /tmp/usb-botbase
          make -j2
          test -f sys-botbase/sys-botbase.nsp

      - name: Package clean SD overlay
        run: |
          OUT="$GITHUB_WORKSPACE/usb-botbase-HOS23-test"
          TITLE="$OUT/atmosphere/contents/430000000000000B"
          mkdir -p "$TITLE/flags"
          cp /tmp/usb-botbase/sys-botbase/sys-botbase.nsp "$TITLE/exefs.nsp"
          : > "$TITLE/flags/boot2.flag"
          printf 'usb\n' > "$TITLE/config.cfg"
          cat > "$OUT/BUILD_INFO.txt" <<EOF
          Experimental HOS 23 compatibility test build.
          Source: https://github.com/Koi-3088/usb-botbase
          Commit: $USB_BOTBASE_COMMIT
          Built with: devkitpro/devkita64:latest
          Mode: usb
          Title ID: 430000000000000B
          EOF
          cd "$GITHUB_WORKSPACE"
          zip -r usb-botbase-HOS23-test.zip usb-botbase-HOS23-test

      - name: Upload SD-ready test build
        uses: actions/upload-artifact@v4
        with:
          name: usb-botbase-HOS23-test
          path: usb-botbase-HOS23-test.zip
          if-no-files-found: error
