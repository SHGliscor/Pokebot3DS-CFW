name: Recover v0p42Z controller source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sync-v0p42z-clean-release.yml

permissions:
  contents: write

jobs:
  recover-controller-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-v0p42z-clean-release
          fetch-depth: 0

      - name: Recover target files from intact archive prefix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, io, lzma, tarfile

          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          parts = sorted(Path('source_payload/v0p42Z/parts').glob('part-*.b64'))
          clean = []
          for p in parts[:18]:
              raw = p.read_text(encoding='ascii', errors='ignore')
              clean.append(''.join(ch for ch in raw if ch in alphabet))

          encoded = ''.join(clean)
          compressed = base64.b64decode(encoded, validate=True)
          dec = lzma.LZMADecompressor()
          data = dec.decompress(compressed)
          print(f'intact compressed prefix: {len(compressed)} bytes')
          print(f'partial tar output: {len(data)} bytes; xz_eof={dec.eof}')

          wanted = {
              'pokebot/common/luma_input.py',
              'pokebot/common/acknowledged_input.py',
              'pokebot/common/bridge.py',
          }
          found = {}
          bio = io.BytesIO(data)
          try:
              tf = tarfile.open(fileobj=bio, mode='r:')
              while True:
                  try:
                      member = tf.next()
                  except (tarfile.ReadError, EOFError, OSError) as e:
                      print(f'partial tar ended: {e}')
                      break
                  if member is None:
                      break
                  name = member.name.lstrip('./')
                  if name in wanted and member.isfile():
                      f = tf.extractfile(member)
                      if f is not None:
                          found[name] = f.read()
                          print(f'RECOVERED {name}: {len(found[name])} bytes')
          except tarfile.ReadError as e:
              print(f'tar open/read ended: {e}')

          if 'pokebot/common/luma_input.py' not in found:
              raise SystemExit('luma_input.py was not present in the intact archive prefix')

          root = Path('recovered_v0p42Z')
          for name, content in found.items():
              out = root / name
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(content)
          PY

      - name: Commit recovered controller source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered_v0p42Z
          git commit -m 'chore: recover exact v0p42Z controller source'
          git push origin HEAD:sync-v0p42z-clean-release
